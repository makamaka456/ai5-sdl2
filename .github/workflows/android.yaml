name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'include/**'
      - 'subprojects/**'
      - 'fonts/**'
      - '.github/workflows/android.yaml'
  workflow_dispatch:

# only build the newest commit of a branch
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    name: APK
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Fetch native dependencies
      run: android/fetch-deps.sh

    - name: Build APK
      working-directory: android
      run: gradle --no-daemon assembleRelease

    - name: List APK contents
      run: unzip -l android/app/build/outputs/apk/release/*.apk | grep -E "\.so|fonts/|\.dex"

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Emulator smoke test
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        target: google_apis
        disable-animations: true
        script: android/smoke-test.sh

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ai5-launcher-apk
        path: android/app/build/outputs/apk/release/*.apk
