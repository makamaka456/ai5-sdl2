name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'include/**'
      - 'subprojects/**'
      - 'fonts/**'
      - '.github/workflows/android.yaml'
  workflow_dispatch:

# only build the newest commit of a branch
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    name: APK
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Fetch native dependencies
      run: android/fetch-deps.sh

    - name: Build APK
      working-directory: android
      run: gradle --no-daemon assembleRelease

    - name: List APK contents
      run: unzip -l android/app/build/outputs/apk/release/*.apk | grep -E "\.so|fonts/|\.dex"

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Emulator smoke test
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        target: google_apis
        disable-animations: true
        script: android/smoke-test.sh

    - name: Name the APK
      run: cp android/app/build/outputs/apk/release/*.apk android/app/build/outputs/apk/release/ai5-launcher.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ai5-launcher-apk
        path: android/app/build/outputs/apk/release/*.apk

    # a fixed download address: the "android-latest" release always has the newest APK
    - name: Publish to the android-latest release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: android-latest
        name: AI5 런처 (최신 안드로이드 빌드)
        prerelease: true
        make_latest: false
        body: |
          가장 최근에 빌드된 AI5 런처 APK입니다. 아래 Assets에서 `ai5-launcher.apk`를 받아 설치하세요.
          커밋: ${{ github.sha }}
        files: android/app/build/outputs/apk/release/ai5-launcher.apk
