plugins {
    id 'com.android.application'
}

android {
    namespace 'org.ai5sdl2.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'org.ai5sdl2.launcher'
        minSdk 21
        targetSdk 35
        versionCode 5
        versionName '0.5'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    // A fixed key, so that a new APK can be installed over the old one.
    // It is public on purpose (personal sideloaded app); do not reuse it.
    signingConfigs {
        launcher {
            storeFile file('../ai5-launcher.keystore')
            storePassword 'ai5launcher'
            keyAlias 'ai5'
            keyPassword 'ai5launcher'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.launcher
        }
        debug {
            signingConfig signingConfigs.launcher
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // SDL's Java classes (org.libsdl.app), from the SDL source fetched by
            // android/fetch-deps.sh
            java.srcDirs += 'jni/deps/SDL/android-project/app/src/main/java'
            // fonts used by the engine (copied to the app's files dir at start)
            assets.srcDirs += 'build/generated/fontassets'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// copy ../../fonts/*.ttf into assets/fonts
tasks.register('copyFonts', Copy) {
    from('../../fonts') { include '*.ttf', '*.license' }
    into layout.buildDirectory.dir('generated/fontassets/fonts')
}
preBuild.dependsOn copyFonts
